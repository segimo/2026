<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두두와 함께하는 조선 붕당정치 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --card:#ffffff; --ink:#3b3340; --muted:#8a7f88;
  --jade:#3fb37f; --jade-d:#2b8a5f; --jade-l:#dff5e9;
  --red:#f2646a; --red-d:#c9444b; --red-l:#ffe4e5;
  --pink:#ff9fb3; --gold:#ffc84a; --gold-d:#e0a521;
  --sky:#6ec3f4; --sky-d:#3f9bd0; --line:#eadfce;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif;
  background-image:radial-gradient(#f3e6cf 1.2px,transparent 1.2px);background-size:22px 22px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400}
button{font-family:inherit;cursor:pointer;border:none}

/* buttons */
.btn{font-family:'Jua';font-size:19px;padding:14px 18px;border-radius:16px;width:100%;
  background:var(--jade);color:#fff;box-shadow:0 5px 0 var(--jade-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--jade-d)}
.btn:disabled{background:#e6dfd6;color:#b2a8a0;box-shadow:0 5px 0 #d2c9be;cursor:default}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.btn.ghost{background:#fff;color:var(--muted);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}

/* home */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.stat{display:flex;gap:6px;align-items:center;font-family:'Jua';font-size:18px;background:#fff;
  padding:6px 12px;border-radius:999px;border:2px solid var(--line)}
.hero{display:flex;align-items:center;gap:12px;margin:8px 18px 4px;background:#fff;border:2px solid var(--line);
  border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 var(--line)}
.hero h1{margin:0;font-size:24px;line-height:1.2}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:15px}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding:30px 0 60px}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.node{width:86px;height:80px;border-radius:50%;font-size:36px;display:flex;align-items:center;justify-content:center;
  background:var(--c);box-shadow:0 7px 0 var(--cd);transition:transform .1s;position:relative}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node.done::after{content:'⭐';position:absolute;top:-8px;right:-6px;font-size:24px}
.node-label{font-family:'Jua';font-size:17px;background:#fff;padding:6px 12px;border-radius:12px;border:2px solid var(--line);text-align:center}
.node-label small{display:block;font-family:'Gowun Dodum';font-size:12px;color:var(--muted)}
.connector{width:6px;height:26px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px);margin:-26px 0}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
.x{background:none;font-size:26px;color:#b9aea6;padding:0 4px}
.bar{flex:1;height:16px;background:#ece3d6;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(var(--jade) 0 45%,#36a070 45%);
  border-radius:999px;transition:width .4s cubic-bezier(.3,1.4,.6,1)}
.hearts{font-family:'Jua';font-size:19px;color:var(--red);display:flex;align-items:center;gap:4px}
.qarea{flex:1;padding:8px 18px 190px;animation:slide .35s ease}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.tag{display:inline-flex;gap:6px;align-items:center;font-family:'Jua';color:var(--sky-d);font-size:15px;margin:6px 0}
.qhead{display:flex;align-items:flex-end;gap:10px;margin:6px 0 18px}
.qhead .bubble{flex:1;font-size:18px;line-height:1.55}
.qhead .bubble::before{content:'';position:absolute;left:-10px;bottom:18px;border:8px solid transparent;border-right-color:var(--line)}
.qhead .bubble::after{content:'';position:absolute;left:-6px;bottom:19px;border:7px solid transparent;border-right-color:#fff}
.choices{display:grid;gap:12px}
.choice{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;text-align:left;
  box-shadow:0 4px 0 var(--line);color:var(--ink);display:flex;gap:12px;align-items:center;font-family:'Gowun Dodum'}
.choice .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-family:'Jua';color:var(--muted);font-size:15px}
.choice.sel{border-color:var(--sky);background:#eaf6fe;box-shadow:0 4px 0 var(--sky)}
.choice.sel .k{border-color:var(--sky);color:var(--sky-d)}
.choice.right{border-color:var(--jade);background:var(--jade-l);box-shadow:0 4px 0 var(--jade)}
.choice.wrong{border-color:var(--red);background:var(--red-l);box-shadow:0 4px 0 var(--red)}
.tf{grid-template-columns:1fr 1fr}
.tf .choice{flex-direction:column;justify-content:center;font-family:'Jua';font-size:22px;padding:22px 10px}
.tf .choice span{font-size:40px}

/* tiles */
.answer-line{min-height:64px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);
  display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;align-content:flex-start;margin-bottom:22px}
.answer-line.col{flex-direction:column;flex-wrap:nowrap;border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:120px}
.answer-line.col:empty::before{content:'아래 카드를 순서대로 눌러 쌓아요 ⬇';color:#c2b6ab;margin:auto}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:16px;
  box-shadow:0 4px 0 var(--line);color:var(--ink);font-family:'Gowun Dodum'}
.tile.used{background:#ece3d6;color:transparent;box-shadow:none;border-color:#ece3d6;pointer-events:none}
.tile.num{display:flex;gap:10px;align-items:center;text-align:left}
.tile.num b{font-family:'Jua';color:var(--sky-d)}
.sentence{font-size:19px;line-height:2.4;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:22px}
.slot{display:inline-block;min-width:74px;border-bottom:3px solid var(--sky);margin:0 4px;text-align:center;
  font-family:'Jua';color:var(--sky-d);line-height:1.5;cursor:pointer;vertical-align:baseline}
.slot.empty{color:transparent}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:12px;align-content:start}
.mt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:15px;min-height:62px;
  box-shadow:0 4px 0 var(--line);color:var(--ink);font-family:'Gowun Dodum';line-height:1.35}
.mt.sel{border-color:var(--sky);background:#eaf6fe;box-shadow:0 4px 0 var(--sky)}
.mt.ok{border-color:var(--jade);background:var(--jade-l);color:var(--jade-d);box-shadow:none;opacity:.55;pointer-events:none}
.mt.bad{animation:shake .35s;border-color:var(--red);background:var(--red-l)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* footer / feedback */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding:16px 18px 22px;z-index:5}
.foot-in{max-width:524px;margin:0 auto}
.foot.good{background:var(--jade-l);border-color:#bfe8d2}
.foot.bad{background:var(--red-l);border-color:#ffc6c8}
.fb{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;animation:pop .3s ease}
@keyframes pop{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.fb h3{margin:0 0 4px;font-size:22px}
.foot.good h3{color:var(--jade-d)} .foot.bad h3{color:var(--red-d)}
.fb p{margin:0;font-size:15px;line-height:1.55}
.fb .ans{font-family:'Jua';color:var(--red-d);margin-bottom:4px;font-size:16px}
.fb-icon{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}

/* result */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 22px;text-align:center;gap:14px}
.result h2{font-size:32px;margin:0;color:var(--gold-d)}
.result.fail h2{color:var(--red-d)}
.cards{display:flex;gap:12px;width:100%}
.rc{flex:1;border-radius:16px;border:2px solid var(--c);overflow:hidden;background:#fff}
.rc .h{background:var(--c);color:#fff;font-family:'Jua';padding:6px;font-size:14px}
.rc .v{font-family:'Jua';font-size:26px;padding:12px 4px;color:var(--c)}
.bounce{animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.modal{position:fixed;inset:0;background:rgba(59,51,64,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:24px 20px 26px;text-align:center;animation:pop .25s}
.modal .sheet h3{margin:8px 0 6px;font-size:22px}
.modal .sheet p{margin:0 0 18px;color:var(--muted)}
.modal .sheet .btn+.btn{margin-top:12px}
.note{font-size:12px;color:var(--muted);text-align:center;padding:0 24px 30px;line-height:1.6}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ================== 마스코트 (사용자 그림 캐릭터: 줄무늬 티셔츠 곰돌이 '두두') ================== */
let _mid=0;
function mascot(mood='normal', size=90){
  const FUR='#f8b88e', FUR2='#ffe0c8', LINE='#3b3340', BLUE='#3aaee6', id='dd'+(++_mid);
  const brows = {
    normal:`<path d="M36.5 47.5 L42 46 M67.5 47.5 L62 46"/>`,
    happy:`<path d="M36.5 46 L42 45.5 M67.5 46 L62 45.5"/>`,
    sad:`<path d="M36.5 49.5 L42 46 M67.5 49.5 L62 46"/>`,
    wow:`<path d="M36.5 44 L42 43 M67.5 44 L62 43"/>`
  }[mood].replace('/>',` stroke="${LINE}" stroke-width="2.2" stroke-linecap="round" fill="none"/>`);
  const shine = (x,y,r)=>`<circle cx="${x+r*.35}" cy="${y-r*.4}" r="${r*.42}" fill="#fff"/><circle cx="${x-r*.4}" cy="${y+r*.4}" r="${r*.18}" fill="#fff"/>`;
  const eyes = {
    normal:`<ellipse cx="40" cy="56" rx="3.8" ry="4.4" fill="${LINE}"/><ellipse cx="64" cy="56" rx="3.8" ry="4.4" fill="${LINE}"/>${shine(40,56,3.8)}${shine(64,56,3.8)}`,
    happy:`<path d="M35.5 57.5 q4.5 -6.5 9 0 M59.5 57.5 q4.5 -6.5 9 0" stroke="${LINE}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
    sad:`<ellipse cx="40" cy="57" rx="3.6" ry="4" fill="${LINE}"/><ellipse cx="64" cy="57" rx="3.6" ry="4" fill="${LINE}"/>${shine(40,57,3.6)}${shine(64,57,3.6)}
      <path d="M68 61 q3.2 5 0 8 q-3.2 -3 0 -8z" fill="#7cc8f2"/>`,
    wow:`<ellipse cx="40" cy="56" rx="5" ry="5.6" fill="${LINE}"/><ellipse cx="64" cy="56" rx="5" ry="5.6" fill="${LINE}"/>
      <path d="M41.8 51.5 l1 2.1 l2.1 1 l-2.1 1 l-1 2.1 l-1 -2.1 l-2.1 -1 l2.1 -1z M65.8 51.5 l1 2.1 l2.1 1 l-2.1 1 l-1 2.1 l-1 -2.1 l-2.1 -1 l2.1 -1z" fill="#fff"/>
      <circle cx="38" cy="58.5" r="1" fill="#fff"/><circle cx="62" cy="58.5" r="1" fill="#fff"/>`
  }[mood];
  const mouth = {
    normal:`<path d="M52 65 q-0.5 3.8 -4.5 3.4 M52 65 q0.5 3.8 4.5 3.4" stroke="${LINE}" stroke-width="2" fill="none" stroke-linecap="round"/>`,
    happy:`<path d="M47.5 66 q4.5 7.5 9 0 z" fill="#e8576b" stroke="${LINE}" stroke-width="1.8" stroke-linejoin="round"/><path d="M49.5 69.3 q2.5 1.6 5 0" fill="#ff9aa8"/>`,
    sad:`<path d="M48.5 70 q3.5 -3 7 0" stroke="${LINE}" stroke-width="2" fill="none" stroke-linecap="round"/>`,
    wow:`<ellipse cx="52" cy="69" rx="2.6" ry="3.2" fill="#e8576b" stroke="${LINE}" stroke-width="1.6"/>`
  }[mood];
  return `<svg width="${size}" height="${size}" viewBox="0 0 104 104" aria-hidden="true">
    <defs><clipPath id="${id}"><path d="M36 99 Q34 82 52 81 Q70 82 68 99 Z"/></clipPath></defs>
    <ellipse cx="52" cy="100.5" rx="22" ry="3" fill="#000" opacity=".08"/>
    <!-- 동글동글 팔 -->
    <ellipse cx="33.5" cy="91" rx="5" ry="7" transform="rotate(35 33.5 91)" fill="${FUR}" stroke="${LINE}" stroke-width="2.2"/>
    <ellipse cx="70.5" cy="91" rx="5" ry="7" transform="rotate(-35 70.5 91)" fill="${FUR}" stroke="${LINE}" stroke-width="2.2"/>
    <!-- 줄무늬 티셔츠 -->
    <path d="M36 99 Q34 82 52 81 Q70 82 68 99 Z" fill="#fff"/>
    <g clip-path="url(#${id})" fill="${BLUE}"><rect x="20" y="84" width="64" height="4"/><rect x="20" y="92" width="64" height="4"/></g>
    <path d="M36 99 Q34 82 52 81 Q70 82 68 99 Z" fill="none" stroke="${LINE}" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M52 97 q-4.6 -3.2 -4.6 -6 q0 -2.3 2.3 -2.3 q1.6 0 2.3 1.6 q0.7 -1.6 2.3 -1.6 q2.3 0 2.3 2.3 q0 2.8 -4.6 6z" fill="#e23b4e"/>
    <!-- 귀 -->
    <circle cx="27" cy="30" r="10" fill="${FUR}" stroke="${LINE}" stroke-width="2.6"/><circle cx="27.5" cy="30.5" r="5" fill="#ffb3a7"/>
    <circle cx="77" cy="30" r="10" fill="${FUR}" stroke="${LINE}" stroke-width="2.6"/><circle cx="76.5" cy="30.5" r="5" fill="#ffb3a7"/>
    <!-- 말랑한 얼굴 -->
    <path d="M20 57 Q19 30 52 29 Q85 30 84 57 Q83 83 52 83 Q21 83 20 57 Z" fill="${FUR}" stroke="${LINE}" stroke-width="2.6"/>
    <ellipse cx="52" cy="66" rx="10" ry="7.5" fill="${FUR2}"/>
    <!-- 볼터치 + 주근깨 -->
    <ellipse cx="30" cy="66" rx="6" ry="3.6" fill="#ff8f9e" opacity="${mood==='sad'?'.3':'.55'}"/>
    <ellipse cx="74" cy="66" rx="6" ry="3.6" fill="#ff8f9e" opacity="${mood==='sad'?'.3':'.55'}"/>
    <g fill="#a0614a"><circle cx="27" cy="62" r=".9"/><circle cx="30" cy="61" r=".9"/><circle cx="33" cy="62" r=".9"/>
      <circle cx="77" cy="62" r=".9"/><circle cx="74" cy="61" r=".9"/><circle cx="71" cy="62" r=".9"/></g>
    ${brows}${eyes}
    <ellipse cx="52" cy="62.8" rx="3.4" ry="2.4" fill="${LINE}"/><ellipse cx="51" cy="62" rx="1.1" ry=".6" fill="#fff" opacity=".7"/>
    ${mouth}
  </svg>`;
}


/* ================== 문제 데이터 ================== */
const LESSONS = [
{ id:'l1', title:'붕당의 탄생', sub:'선조 ~ 인조반정', emoji:'🌱', c:'#3fb37f', cd:'#2b8a5f', qs:[
  {t:'mc', q:'선조 때 사림이 <b>동인</b>과 <b>서인</b>으로 처음 갈라지게 된 계기는 어떤 관직을 둘러싼 다툼이었을까요?',
   ch:['영의정','이조전랑','도승지','병조판서'], a:1,
   exp:'이조전랑(이조의 정랑·좌랑)은 품계는 정5품·정6품으로 높지 않았지만, 삼사 관리를 추천하고 자기 후임자를 추천하는 권한이 있어서 아주 중요한 자리였어요. 1575년(선조 8) 김효원과 심의겸이 이 자리를 두고 대립하면서 동서 분당이 일어났어요.'},
  {t:'mc', q:'선조가 즉위한 뒤 중앙 정치를 주도하게 되었고, 이후 내부에서 여러 붕당으로 나뉜 세력은?',
   ch:['훈구','외척','사림','환관'], a:2,
   exp:'여러 차례 사화로 피해를 입었던 사림은 선조 때 중앙 정계를 장악했어요. 붕당은 바로 이 사림 내부에서 정치적·학문적 입장 차이로 나뉜 것이에요.'},
  {t:'match', q:'짝을 맞춰 보세요!',
   pairs:[['동인','김효원'],['서인','심의겸'],['동인의 학통','이황 · 조식'],['서인의 학통','이이 · 성혼']],
   exp:'동인은 김효원을 중심으로 이황·조식의 학문을 잇는 영남 사림이 많았고, 서인은 심의겸을 중심으로 이이·성혼의 학문을 잇는 기호 사림이 많았어요.'},
  {t:'tf', q:'"동인·서인"이라는 이름은 김효원의 집이 한양의 동쪽에, 심의겸의 집이 서쪽에 있었던 데서 비롯되었다.',
   a:true, exp:'맞아요! 김효원의 집은 동쪽 건천동에, 심의겸의 집은 서쪽 정동에 있어서 각각을 따르는 무리를 동인·서인이라 불렀어요.'},
  {t:'blank', q:'빈칸을 채워 문장을 완성하세요.',
   parts:['동인은 정여립 모반 사건과 정철의 건저의 사건 처리를 두고, 강경파인 ','과 온건파인 ','으로 나뉘었다.'],
   bank:['북인','남인','노론','소론'], ans:['북인','남인'],
   exp:'정여립 모반 사건(기축옥사, 1589)과 광해군을 세자로 세우자고 건의한 정철의 건저의 사건(1591)을 계기로, 서인에 강경한 북인과 온건한 남인으로 갈라졌어요.'},
  {t:'mc', q:'광해군 때 정권을 잡았지만, <b>인조반정(1623)</b>으로 몰락한 붕당은?',
   ch:['서인','남인','북인','소론'], a:2,
   exp:'광해군 때는 북인이 집권했어요. 하지만 서인이 일으킨 인조반정으로 광해군이 쫓겨나면서 북인은 몰락했고, 이후 서인이 정권을 주도하고 남인 일부가 참여하는 구도가 만들어졌어요.'},
]},
{ id:'l2', title:'예송 논쟁', sub:'현종 · 상복을 둘러싼 논쟁', emoji:'🎎', c:'#6ec3f4', cd:'#3f9bd0', qs:[

function beep(ok){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = ok ? [660,880] : [300,220];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type = ok?'triangle':'square'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, actx.currentTime+i*0.11);
      g.gain.exponentialRampToValueAtTime(ok?0.18:0.07, actx.currentTime+i*0.11+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+i*0.11+0.16);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime+i*0.11); o.stop(actx.currentTime+i*0.11+0.18);
    });
  }catch(e){}
}

  getAnswer = ()=>{
    const ok = sel===current.a;
    body.querySelectorAll('.choice').forEach(x=>{ x.disabled=true;
      if(+x.dataset.i===current.a) x.classList.add('right'); else if(+x.dataset.i===sel) x.classList.add('wrong'); });
    return {ok, correct: current.ch[current.a]};
  };
}
/* --- OX --- */
function renderTF(body){
  body.innerHTML = `<div class="choices tf">
    <button class="choice" data-v="1"><span>⭕</span>맞아요</button>
    <button class="choice" data-v="0"><span>❌</span>틀려요</button></div>`;
  let sel=null;
  body.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    body.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); sel = b.dataset.v==='1'; setReady(true);
  });
  getAnswer = ()=>{
    const ok = sel===current.a;
    body.querySelectorAll('.choice').forEach(x=>{ x.disabled=true; const v=x.dataset.v==='1';
      if(v===current.a) x.classList.add('right'); else if(v===sel) x.classList.add('wrong'); });
    return {ok, correct: current.a?'⭕ 맞아요':'❌ 틀려요'};
  };
}
/* --- 짝 맞추기 --- */
function renderMatch(body){
  const P = current.pairs;
  const L = shuffle(P.map((p,i)=>i)), R = shuffle(P.map((p,i)=>i));
  body.innerHTML = `<div class="match">
    <div class="col">${L.map(i=>`<button class="mt" data-s="L" data-i="${i}">${P[i][0]}</button>`).join('')}</div>
    <div class="col">${R.map(i=>`<button class="mt" data-s="R" data-i="${i}">${P[i][1]}</button>`).join('')}</div></div>`;
  let selL=null, selR=null, matched=0, mistakes=0;
  const tryPair = ()=>{
    if(!selL||!selR) return;
    const a=selL, b=selR; selL=selR=null;
    if(a.dataset.i===b.dataset.i){
      [a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');}); matched++; beep(true);
      if(matched===P.length) setTimeout(()=>{ setReady(true); check(); }, 350);
    } else {
      mistakes++; beep(false);
      [a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),400);});
    }
  };
  body.querySelectorAll('.mt').forEach(b=>b.onclick=()=>{
    if(b.dataset.s==='L'){ body.querySelectorAll('[data-s=L]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); selL=b; }
    else { body.querySelectorAll('[data-s=R]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); selR=b; }
    tryPair();
  });
  getAnswer = ()=>({ok:true, note: mistakes? `실수 ${mistakes}번이 있었지만 모두 맞췄어요!` : '한 번도 안 틀리고 다 맞췄어요!'});
}
/* --- 순서 맞추기 --- */
function renderOrder(body){
  const items = current.items; let order;
  do { order = shuffle(items.map((x,i)=>i)); } while(order.every((v,i)=>v===i));
  body.innerHTML = `<div class="answer-line col" id="ans"></div>
    <div class="bank" id="bank">${order.map(i=>`<button class="tile" data-i="${i}">${items[i]}</button>`).join('')}</div>`;
  const ans = body.querySelector('#ans'); const picked=[];
  const draw = ()=>{
    ans.innerHTML = picked.map((i,n)=>`<button class="tile num" data-i="${i}"><b>${n+1}</b>${items[i]}</button>`).join('');
    ans.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{ if(!body.dataset.locked){ const i=+t.dataset.i; picked.splice(picked.indexOf(i),1); body.querySelector(`#bank [data-i="${i}"]`).classList.remove('used'); draw(); }});
    setReady(picked.length===items.length);
  };
  body.querySelectorAll('#bank .tile').forEach(t=>t.onclick=()=>{ picked.push(+t.dataset.i); t.classList.add('used'); draw(); });
  getAnswer = ()=>{
    body.dataset.locked='1'; body.querySelectorAll('.tile').forEach(t=>t.disabled=true);
    const ok = picked.every((v,i)=>v===i);
    return {ok, correct: items.map((x,i)=>`${i+1}. ${x.split(' — ')[0]}`).join('  →  ')};
  };
}
/* --- 빈칸 --- */
function renderBlank(body){
  const n = current.ans.length; const fill = Array(n).fill(null);
  const bank = shuffle(current.bank.map((w,i)=>i));
  let html=''; current.parts.forEach((p,i)=>{ html+=p; if(i<n) html+=`<span class="slot empty" data-s="${i}">　</span>`; });
  body.innerHTML = `<div class="sentence">${html}</div>
    <div class="bank">${bank.map(i=>`<button class="tile" data-w="${i}">${current.bank[i]}</button>`).join('')}</div>`;
  const draw = ()=>{
    body.querySelectorAll('.slot').forEach(s=>{ const v=fill[+s.dataset.s];
      s.textContent = v==null?'　':current.bank[v]; s.classList.toggle('empty', v==null); });
    setReady(fill.every(v=>v!=null));
  };
  body.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
    const k = fill.indexOf(null); if(k<0) return;
    fill[k] = +t.dataset.w; t.classList.add('used'); draw();
  });
  body.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{
    if(body.dataset.locked) return;
    const k=+s.dataset.s; if(fill[k]==null) return;
    body.querySelector(`.tile[data-w="${fill[k]}"]`).classList.remove('used'); fill[k]=null; draw();
  });
  getAnswer = ()=>{
    body.dataset.locked='1'; body.querySelectorAll('.tile').forEach(t=>t.disabled=true);
    const ok = fill.every((v,i)=>current.bank[v]===current.ans[i]);
    return {ok, correct: current.ans.join(', ')};
  };
}

/* --- 채점 --- */
function check(){
  if(!ready) return;
  const r = getAnswer();
  const first = !S.tried.has(current._i);
  S.tried.add(current._i);
  if(r.ok){
    S.solved.add(current._i); if(first) S.firstTry.add(current._i);
    S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo);
    S.xp += first ? 10 : 5;
  } else {
    S.combo=0; S.hearts--; S.queue.push(current);
  }
  if(current.t!=='match') beep(r.ok);
  updateBar();
  const f = document.getElementById('foot'); f.className = 'foot '+(r.ok?'good':'bad');
  const comboTxt = r.ok && S.combo>=3 ? ` 🔥 ${S.combo}연속!` : '';
  document.getElementById('footin').innerHTML = `
    <div class="fb">
      <div class="fb-icon">${mascot(r.ok?'happy':'sad',44)}</div>
      <div>
        <h3>${r.ok?pick(cheers)+comboTxt:pick(oops)}</h3>
        ${!r.ok?`<div class="ans">정답: ${r.correct}</div>`:''}
        ${r.note?`<div class="ans" style="color:var(--jade-d)">${r.note}</div>`:''}
        <p>${current.exp}</p>
      </div>
    </div>
    <button class="btn ${r.ok?'':'red'}" id="next">${S.hearts<=0?'결과 보기':'계속하기'}</button>`;
  document.getElementById('next').onclick = ()=> S.hearts<=0 ? finish(false) : nextQ();
}

/* ================== 결과 ================== */
function finish(win){
  const L=S.L, total=L.qs.length;
  const acc = Math.round(S.firstTry.size/total*100);
  if(win){
    save.done[L.id]=true; save.xp += S.xp + (S.hearts===5?5:0);
    save.best[L.id] = Math.max(save.best[L.id]||0, acc); store.save(save);
    confetti();
  }
  const perfect = win && S.hearts===5;
  $app.innerHTML = `<div class="result ${win?'':'fail'}">
    <div class="bounce">${mascot(win?(perfect?'wow':'happy'):'sad',130)}</div>
    <h2>${win?(perfect?'완벽한 선비 등극! 🎓':'단원 완료! 🎉'):'하트가 다 떨어졌어요'}</h2>
    <p style="margin:0;color:var(--muted)">${win?`「${L.title}」 단원을 정복했어요.${perfect?' 하트를 하나도 안 잃어서 보너스 +5 XP!':''}`:'괜찮아요! 해설을 떠올리며 한 번 더 도전해 봐요.'}</p>
    <div class="cards">
      <div class="rc" style="--c:var(--gold-d)"><div class="h">획득 XP</div><div class="v">⚡${win?S.xp+(perfect?5:0):0}</div></div>
      <div class="rc" style="--c:var(--jade)"><div class="h">첫 시도 정답률</div><div class="v">🎯${acc}%</div></div>
      <div class="rc" style="--c:#e0738c"><div class="h">최대 연속</div><div class="v">🔥${S.maxCombo}</div></div>
    </div>
    <div style="width:100%;display:grid;gap:12px;margin-top:10px">
      ${win && LESSONS.indexOf(L)<LESSONS.length-1 ? `<button class="btn" id="nextL">다음 단원으로 →</button>`:''}
      <button class="btn ${win?'ghost':''}" id="again">${win?'한 번 더 복습하기':'다시 도전!'}</button>
      <button class="btn ghost" id="home">지도로 돌아가기</button>
    </div></div>`;
  const nl=document.getElementById('nextL'); if(nl) nl.onclick=()=>startLesson(LESSONS[LESSONS.indexOf(L)+1]);
  document.getElementById('again').onclick=()=>startLesson(L);
  document.getElementById('home').onclick=home;
}
function confetti(){
  const cs=['#3fb37f','#ffc84a','#ff9fb3','#6ec3f4','#b69cf2'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=cs[i%cs.length];
    c.style.animationDuration=(1.8+Math.random()*1.6)+'s'; c.style.animationDelay=(Math.random()*.6)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),4200);
  }
}

home();
</script>
</body>
</html>
